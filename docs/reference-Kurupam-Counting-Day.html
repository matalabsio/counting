<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Kurupam Counting Day</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Telugu:wght@400;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Two views on one page: Viewer (read-only scoreboard with photos) and Counter (result entry in a bottom sheet). Colours follow the campaign posters: deep green, yellow, red. */
:root {
  --bg: #f5f2e8; --panel: #ffffff; --ink: #14231b; --muted: #5d6c62; --line: #e1dccb; --soft: #efeadb;
  --head: #ffd60a; --head-ink: #2b2300; --tdp: #ffd60a; --bjp: #ff7a00; --jsp: #e11d2e; --yellow: #ffd60a; --yellow-ink: #3a2f00;
  --win: #14793c; --win-soft: #dcf2e2; --trail: #b42318; --trail-soft: #fde3df;
  --tie: #8a5a00; --tie-soft: #fbecc8; --idle: #66746b; --idle-soft: #ece8da;
  --focus: #1857b8; --shadow: 0 1px 2px rgba(20,35,27,.08), 0 6px 18px rgba(20,35,27,.06);
  --sans: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --te: "Noto Sans Telugu", "Nirmala UI", "Plus Jakarta Sans", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0d1511; --panel: #16221b; --ink: #eef3ee; --muted: #9db0a3; --line: #28392f; --soft: #1d2c23;
  --head: #ffd60a; --head-ink: #2b2300; --tdp: #ffd60a; --bjp: #ff7a00; --jsp: #ef3340; --yellow: #ffd60a; --yellow-ink: #3a2f00;
  --win: #4ade80; --win-soft: #123322; --trail: #f87171; --trail-soft: #3b1815;
  --tie: #fbbf24; --tie-soft: #3a2b0a; --idle: #9db0a3; --idle-soft: #1f2d25;
  --focus: #7db0ff; --shadow: 0 1px 2px rgba(0,0,0,.4); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0d1511; --panel: #16221b; --ink: #eef3ee; --muted: #9db0a3; --line: #28392f; --soft: #1d2c23;
  --head: #ffd60a; --head-ink: #2b2300; --tdp: #ffd60a; --bjp: #ff7a00; --jsp: #ef3340; --yellow: #ffd60a; --yellow-ink: #3a2f00;
  --win: #4ade80; --win-soft: #123322; --trail: #f87171; --trail-soft: #3b1815;
  --tie: #fbbf24; --tie-soft: #3a2b0a; --idle: #9db0a3; --idle-soft: #1f2d25;
  --focus: #7db0ff; --shadow: 0 1px 2px rgba(0,0,0,.4); color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.45; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.te { font-family: var(--te); }
.wrap { max-width: 1080px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* header */
.top { background: var(--head); color: var(--head-ink); position: relative; padding-bottom: 0; }
.top::after { content: ""; display: block; height: 7px; background: linear-gradient(90deg, var(--tdp) 0 34%, var(--bjp) 34% 67%, var(--jsp) 67% 100%); }
.top .wrap { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 10px 16px; padding-block: 16px 0; }
.eyebrow { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; opacity: .8; font-weight: 600; }
h1 { margin: 2px 0 0; font-size: 26px; line-height: 1.1; font-weight: 800; letter-spacing: -.01em; text-wrap: balance; }
.live { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; padding-bottom: 4px; }
.live i { width: 9px; height: 9px; border-radius: 50%; background: #9aa89f; }
.live.on i { background: #4ade80; box-shadow: 0 0 0 0 rgba(74,222,128,.6); animation: pulse 2s infinite; }
@keyframes pulse { 70% { box-shadow: 0 0 0 8px rgba(74,222,128,0); } 100% { box-shadow: 0 0 0 0 rgba(74,222,128,0); } }
@media (prefers-reduced-motion: reduce) { .live.on i { animation: none; } }
.tabs { display: flex; gap: 4px; width: 100%; padding-top: 12px; }
.tabs button { background: transparent; border: 0; color: var(--head-ink); opacity: .75; padding: 10px 18px; font-weight: 700; border-radius: 10px 10px 0 0; }
.tabs button[aria-selected="true"] { background: var(--bg); color: var(--ink); opacity: 1; }

main { padding-block: 18px 40px; }
.notice { padding: 10px 14px; border-radius: 10px; background: var(--tie-soft); color: var(--ink); border: 1px solid var(--line); margin-bottom: 14px; font-size: 14px; }
.notice.err { background: var(--trail-soft); }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); }
h2 { margin: 0 0 10px; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 700; }

/* status vocabulary: colour + glyph + word, never colour alone */
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; border-radius: 999px; font-size: 12.5px; font-weight: 700; white-space: nowrap; background: var(--idle-soft); color: var(--idle); }
.k-winning, .k-won { --c: var(--win); --cs: var(--win-soft); }
.k-trailing, .k-lost { --c: var(--trail); --cs: var(--trail-soft); }
.k-tied { --c: var(--tie); --cs: var(--tie-soft); }
.k-pending, .k-counting { --c: var(--idle); --cs: var(--idle-soft); }
.chip { background: var(--cs); color: var(--c); }
.chip.solid { background: var(--c); color: var(--panel); }
.party { display: inline-block; padding: 1px 8px; border-radius: 6px; font-size: 11.5px; font-weight: 800; letter-spacing: .03em; background: var(--soft); color: var(--muted); }
.p-TDP { background: var(--tdp); color: var(--yellow-ink); }
.p-JSP { background: var(--jsp); color: #fff; }
.p-BJP { background: var(--bjp); color: #1d1000; }
.r-TDP { border-color: var(--tdp) !important; } .r-BJP { border-color: var(--bjp) !important; } .r-JSP { border-color: var(--jsp) !important; }
.p-YSRCP { background: #1f5fbf; color: #fff; }
.p-INC { background: #19a2d8; color: #00212e; }

.avatar { flex: none; width: var(--s, 64px); height: var(--s, 64px); border-radius: 50%; object-fit: cover; background: var(--yellow); border: 3px solid var(--c, var(--line)); }

/* ZPTC hero */
.hero { display: grid; grid-template-columns: auto 1fr auto; gap: 18px 22px; align-items: center; padding: 18px; border-left: 8px solid var(--c); margin-bottom: 14px; }
.hero .avatar { --s: 112px; }
.hero .kind { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.hero h3 { margin: 2px 0 0; font-size: 24px; line-height: 1.15; font-weight: 800; text-wrap: balance; }
.hero .sub { color: var(--muted); font-size: 14px; margin-top: 2px; }
.hero .meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 8px; }
.big { text-align: right; min-width: 200px; }
.big .word { display: inline-flex; align-items: center; gap: 8px; font-size: 30px; font-weight: 800; color: var(--c); line-height: 1; }
.big .by { font-size: 20px; font-weight: 800; margin-top: 6px; font-variant-numeric: tabular-nums; }
.big .vs { color: var(--muted); font-size: 13px; margin-top: 4px; }
@media (max-width: 720px) {
  .hero { grid-template-columns: auto 1fr; }
  .big { grid-column: 1 / -1; text-align: left; min-width: 0; border-top: 1px solid var(--line); padding-top: 12px; }
  .hero .avatar { --s: 84px; } .hero h3 { font-size: 20px; }
}

/* tally */
.tally { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; margin-bottom: 10px; }
.tile { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 10px 14px; border-top: 4px solid var(--c); }
.tile b { display: block; font-size: 30px; line-height: 1.1; font-weight: 800; font-variant-numeric: tabular-nums; color: var(--ink); }
.tile span { font-size: 12.5px; font-weight: 700; color: var(--c); }
.segs { display: flex; gap: 3px; height: 10px; margin: 0 0 18px; }
.segs i { flex: 1; border-radius: 3px; background: var(--c); opacity: .9; }
.segs i.k-pending, .segs i.k-counting { opacity: .35; }

/* filters */
.filters { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 14px; }
.filters button { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 7px 14px; font-weight: 700; font-size: 14px; }
.filters button[aria-pressed="true"] { background: var(--head); color: var(--head-ink); border-color: var(--bjp); box-shadow: 0 2px 0 var(--bjp); }
.filters button small { opacity: .75; margin-left: 4px; font-weight: 700; }

/* viewer cards */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap: 12px; padding: 0; margin: 0; list-style: none; }
.card { padding: 14px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.card .row1 { display: flex; gap: 12px; align-items: flex-start; }
.card .who { flex: 1; min-width: 0; }
.card .seat { font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; }
.card .name { font-size: 17px; font-weight: 800; line-height: 1.2; overflow-wrap: anywhere; }
.card .tel { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.card .tags { display: flex; gap: 6px; align-items: center; margin-top: 5px; flex-wrap: wrap; }
.votes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.votes div { background: var(--soft); border-radius: 10px; padding: 8px 10px; min-width: 0; }
.votes small { display: block; font-size: 11.5px; font-weight: 700; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.votes b { font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; }
.votes .lead b { color: var(--c); }
.bar { height: 8px; border-radius: 99px; background: var(--trail-soft); overflow: hidden; display: flex; }
.bar i { display: block; background: var(--win); height: 100%; }
.margin { font-weight: 800; font-size: 14px; color: var(--c); display: flex; justify-content: space-between; gap: 8px; }
.margin span:last-child { color: var(--muted); font-weight: 600; font-size: 12.5px; }
.idle { color: var(--muted); font-size: 14px; padding: 10px 2px 2px; border-top: 1px dashed var(--line); }
.empty { padding: 28px; text-align: center; color: var(--muted); }

/* counter */
.list { display: flex; flex-direction: column; gap: 8px; padding: 0; margin: 0; list-style: none; }
.rowbtn { width: 100%; display: flex; gap: 12px; align-items: center; text-align: left; padding: 10px 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; border-left: 6px solid var(--c, var(--line)); }
.rowbtn:hover { background: var(--soft); }
.rowbtn .avatar { --s: 48px; border-width: 2px; }
.rowbtn .mid { flex: 1; min-width: 0; }
.rowbtn .t1 { font-weight: 800; overflow-wrap: anywhere; }
.rowbtn .t2 { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.tag { font-size: 11px; font-weight: 800; color: var(--tie); background: var(--tie-soft); border-radius: 6px; padding: 1px 6px; margin-left: 6px; }
.two { display: grid; grid-template-columns: 1fr; gap: 16px; margin-top: 18px; }
@media (min-width: 820px) { .two { grid-template-columns: 1fr 1fr; } }
.box { padding: 16px; }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 9px 14px; font-weight: 700; }
.btn.primary { background: var(--head); color: var(--head-ink); border-color: var(--head); }
.btn.danger { color: var(--trail); border-color: var(--trail); }
.btn:disabled { opacity: .5; cursor: default; }
.btns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.log { list-style: none; margin: 0; padding: 0; font-size: 13.5px; display: flex; flex-direction: column; gap: 6px; }
.log li { display: flex; gap: 10px; justify-content: space-between; border-bottom: 1px solid var(--line); padding-bottom: 6px; }
.log time { color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.hint { color: var(--muted); font-size: 13.5px; margin: 0 0 10px; }

/* editor sheet */
.scrim { position: fixed; inset: 0; background: rgba(8,18,12,.55); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--bg); width: min(640px, 100%); max-height: 94vh; overflow: auto; border-radius: 20px 20px 0 0; padding: 16px max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
@media (min-width: 700px) { .scrim { align-items: center; } .sheet { border-radius: 20px; } }
.sh-head { display: flex; gap: 12px; align-items: center; margin-bottom: 14px; }
.sh-head .avatar { --s: 56px; }
.sh-head b { font-size: 18px; display: block; line-height: 1.2; }
.sh-head span { font-size: 13px; color: var(--muted); }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 14px; }
.seg label { position: relative; text-align: center; border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 10px 6px; font-weight: 700; font-size: 14px; cursor: pointer; }
.seg input { position: absolute; opacity: 0; inset: 0; cursor: pointer; }
.seg label:has(input:checked) { background: var(--head); color: var(--head-ink); border-color: var(--head); }
.seg label:has(input:focus-visible) { outline: 3px solid var(--focus); outline-offset: 2px; }
.field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
.field > label, .lbl { font-size: 12.5px; font-weight: 700; color: var(--muted); }
.inp { width: 100%; border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 10px 12px; min-width: 0; }
.inp.num { font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; }
.rival { display: grid; grid-template-columns: 1fr 96px 108px 40px; gap: 6px; margin-bottom: 6px; align-items: center; }
.rival .x { border: 1px solid var(--line); background: var(--panel); border-radius: 10px; height: 100%; min-height: 42px; font-weight: 800; color: var(--muted); }
@media (max-width: 520px) { .rival { grid-template-columns: 1fr 1fr 40px; } .rival .nm { grid-column: 1 / -1; } .rival .pt { grid-column: 1; } .rival .vt { grid-column: 2; } }
.preview { border-radius: 12px; padding: 10px 14px; font-weight: 800; background: var(--cs); color: var(--c); margin: 4px 0 12px; display: flex; justify-content: space-between; gap: 10px; }
.checks { margin: 0 0 12px; padding: 0; list-style: none; font-size: 13.5px; display: flex; flex-direction: column; gap: 4px; }
.checks li { padding: 6px 10px; border-radius: 8px; background: var(--tie-soft); }
.ini { display: flex; align-items: center; justify-content: center; background: var(--soft); color: var(--muted); font-weight: 800; font-size: calc(var(--s, 64px) * .36); }
.maj { padding: 18px; margin-bottom: 14px; border-left: 8px solid var(--c); display: grid; grid-template-columns: auto 1fr; gap: 6px 22px; align-items: center; }
.maj .n { font-size: 56px; font-weight: 800; line-height: 1; color: var(--c); font-variant-numeric: tabular-nums; }
.maj .n small { font-size: 20px; color: var(--muted); font-weight: 700; }
.maj .hd { font-size: 20px; font-weight: 800; line-height: 1.2; text-wrap: balance; }
.maj .sb { color: var(--muted); font-size: 14px; margin-top: 2px; }
.maj .segs { grid-column: 1 / -1; margin: 10px 0 0; height: 14px; }
.maj .mark { grid-column: 1 / -1; font-size: 12.5px; color: var(--muted); display: flex; justify-content: space-between; margin-top: -2px; }
.cons { margin: 18px 0 8px; }
.mcard { text-align: left; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; width: 100%; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); }
.mcard:hover { background: var(--soft); }
.mcard b { font-size: 17px; font-weight: 800; }
.mcard small { color: var(--muted); font-weight: 600; font-size: 12.5px; }
.mcard .segs { margin: 0; height: 8px; gap: 2px; }
.mcard .cnt { display: flex; gap: 10px; flex-wrap: wrap; font-size: 13px; font-weight: 800; font-variant-numeric: tabular-nums; }
.mcard .cnt span { color: var(--c); }
.mcard .mtop { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.back { margin-bottom: 12px; }
.mdet { margin-bottom: 8px; }
.mdet summary { cursor: pointer; padding: 10px 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; font-weight: 700; }
.mdet[open] summary { margin-bottom: 8px; }
[hidden] { display: none !important; }
</style>

<header class="top">
  <div class="wrap">
    <div>
      <div class="eyebrow">Parvathipuram Manyam · ZPTC and MPTC · Counting 7 Nov 2026</div>
      <h1>PPM Counting Day</h1>
    </div>
    <div class="live" id="live" role="status"><i></i><span id="liveTxt">Connecting…</span></div>
    <nav class="tabs" role="tablist" aria-label="View">
      <button role="tab" id="tab-viewer" aria-selected="true" data-tab="viewer">PPM Zilla Parishad</button>
      <button role="tab" id="tab-mptc" aria-selected="false" data-tab="mptc">MPTC</button>
      <button role="tab" id="tab-counter" aria-selected="false" data-tab="counter" hidden>Counter</button>
    </nav>
  </div>
</header>

<main class="wrap">
  <div id="msg"></div>
  <section id="viewer" aria-labelledby="tab-viewer"></section>
  <section id="mptc" aria-labelledby="tab-mptc" hidden></section>
  <section id="counter" aria-labelledby="tab-counter" hidden></section>
</main>

    const draft = () => ({ status: ed.status, ours: num(ours.value), nota: nota.value === '' ? null : num(nota.value), note: note.value.trim(), rivals: ed.rivals.filter((x) => x.name.trim() || x.votes !== '').map((x) => ({ name: x.name.trim(), party: x.party, votes: num(x.votes) })) });
    function bump() { if (ed.status === 'pending' && (num(ours.value) > 0 || ed.rivals.some((x) => num(x.votes) > 0))) { ed.status = 'counting'; seg.querySelector('input[value="counting"]').checked = true; } }
    function refresh() {
      const d = draft(), v = derive(d);
      preview.className = 'preview k-' + v.key; preview.replaceChildren(h('span', { text: GLYPH[v.key] + ' ' + LABEL[v.key] }), h('span', { text: v.key === 'pending' ? '' : marginText(v) }));
      const w = [];
      if (d.status !== 'pending' && v.ours === 0 && v.rv === 0) w.push('No votes entered yet.');
      if (d.status === 'declared' && v.rv === 0 && v.ours > 0) w.push('Declared with no rival votes. Add the rival and their count.');
      if (d.status === 'declared' && v.lead === 0 && v.ours > 0) w.push('Votes are level. Check the counts before declaring.');
      if (d.rivals.some((x) => x.votes > 0 && !x.name)) w.push('A rival has votes but no name.');
      const nm = d.rivals.map((x) => x.name.toLowerCase()).filter(Boolean); if (new Set(nm).size < nm.length) w.push('Two rivals have the same name.');
      checks.replaceChildren(...w.map((t) => h('li', { text: t }))); checks.hidden = !w.length;
    }
    function drawRivals() {
      rivalsBox.replaceChildren(...ed.rivals.map((x, i) => h('div', { class: 'rival' },
        h('input', { class: 'inp nm', placeholder: 'Rival name', 'aria-label': 'Rival ' + (i + 1) + ' name', value: x.name, disabled: readOnly, oninput: (e) => { x.name = e.target.value; refresh(); } }),
        h('select', { class: 'inp pt', 'aria-label': 'Rival ' + (i + 1) + ' party', disabled: readOnly, onchange: (e) => { x.party = e.target.value; refresh(); } }, h('option', { value: '', text: 'Party' }), PARTIES.map((p) => h('option', { value: p, selected: x.party === p, text: p }))),
        h('input', { class: 'inp vt', inputmode: 'numeric', placeholder: 'Votes', 'aria-label': 'Rival ' + (i + 1) + ' votes', value: x.votes, disabled: readOnly, oninput: (e) => { x.votes = e.target.value; bump(); refresh(); } }),
        h('button', { type: 'button', class: 'x', 'aria-label': 'Remove rival ' + (i + 1), disabled: readOnly || ed.rivals.length === 1, onclick: () => { ed.rivals.splice(i, 1); drawRivals(); refresh(); }, text: '×' }))));
    }
    ours.addEventListener('input', () => { bump(); refresh(); }); nota.addEventListener('input', refresh);
    drawRivals(); refresh();
    const close = () => { host.replaceChildren(); ed = null; document.removeEventListener('keydown', onKey); };
    const onKey = (e) => { if (e.key === 'Escape') close(); };
    document.addEventListener('keydown', onKey);
    ed.close = close; ed.draft = draft; ed.msg = msg; ed.cand = () => ({ name: cname.value.trim(), party: cparty.value, seat: sname.value.trim() });
    host.append(h('div', { class: 'scrim', onclick: (e) => { if (e.target.classList.contains('scrim')) close(); } },
      h('form', { class: 'sheet', role: 'dialog', 'aria-modal': 'true', 'aria-label': 'Enter result for ' + s.seat, onsubmit: (e) => { e.preventDefault(); if (!readOnly) save(); } },
        h('div', { class: 'sh-head' }, photo(s), h('div', {}, h('b', { text: s.kind + ' · ' + s.seat }), h('span', { text: s.editable ? 'NDA candidate for ' + s.mandal : s.name + ' · ' + s.party + ' · Ballot no. ' + s.no }))),
        readOnly ? h('div', { class: 'notice', text: 'View only. Ask the owner for Contributor access to enter results.' }) : null,
        seg,
        s.editable && s.kind === 'MPTC' ? h('div', { class: 'field' }, h('label', { for: 'f-sname', text: 'Seat name (use the official name once known)' }), sname) : null,
        s.editable ? h('div', { class: 'field' }, h('label', { for: 'f-cname', text: 'NDA candidate' }), h('div', { style: 'display:grid;grid-template-columns:1fr 100px;gap:6px' }, cname, cparty)) : null,
        h('div', { class: 'field' }, h('label', { for: 'f-ours', text: s.editable ? 'NDA votes' : 'Our votes · ' + s.name + ' (' + s.party + ')' }), ours),
        h('div', { class: 'field' }, h('span', { class: 'lbl', text: 'Rivals' }), rivalsBox,
          h('div', {}, h('button', { type: 'button', class: 'btn', disabled: readOnly, onclick: () => { ed.rivals.push({ name: '', party: '', votes: '' }); drawRivals(); }, text: '+ Add rival' }))),
        h('div', { class: 'field' }, h('label', { for: 'f-nota', text: 'NOTA (optional)' }), nota),
        h('div', { class: 'field' }, h('label', { for: 'f-note', text: 'Round or source note (optional)' }), note),
        preview, checks, msg,
        h('div', { class: 'btns', style: 'margin-top:0' },
          h('button', { type: 'submit', class: 'btn primary', id: 'e-save', disabled: readOnly, text: 'Save result' }),
          h('button', { type: 'button', class: 'btn', onclick: close, text: readOnly ? 'Close' : 'Cancel' })))));
    setTimeout(() => { const f = readOnly ? null : $('#f-ours'); if (f) f.focus(); }, 30);
  }
  const errText = (e) => (e && e.code === 'invalid_argument') ? 'You can look at this page but not change it. Ask the owner for Contributor access.' : 'That did not save. Check the connection and try again.';
  async function save() {
    const d = ed.draft(); const btn = $('#e-save'); btn.disabled = true; const id = ed.id; const s = BY[id];
    try {
      const ref = db.doc('results/' + id);
      if (!ed.force) {
        const cur = await ref.get();
        if (cur.exists && (cur.data().updatedAt || null) !== (ed.base || null)) {
          ed.msg.replaceChildren(h('div', { class: 'notice err' }, 'Someone saved this seat at ' + fmtTime(cur.data().updatedAt) + '. Saving now replaces their entry. ',
            h('button', { type: 'button', class: 'btn', onclick: () => { ed.force = true; save(); }, text: 'Save anyway' }), ' ',
            h('button', { type: 'button', class: 'btn', onclick: () => { ed.close(); openSheet(id); }, text: 'Load theirs' })));
          btn.disabled = false; return;
        }
      }
      const body = { status: d.status, ours: d.ours, rivals: d.rivals, nota: d.nota, note: d.note, sample: false, updatedAt: new Date().toISOString(), updatedBy: uid };
      if (BY[id].editable) body.cand = ed.cand();
      await ref.set(body);
      const v = derive(body); await logAction(s.seat, 'saved · ' + LABEL[v.key] + (v.key === 'pending' ? '' : ' · ' + marginText(v)));
      ed.close();
    } catch (e) { ed.msg.replaceChildren(h('div', { class: 'notice err', text: errText(e) })); btn.disabled = false; }
  }

  // ---- test run tools ----
  const toolSay = (t) => { const m = $('#toolmsg'); if (m) m.textContent = t; };
  async function fillSample() {
    const P = [['declared', 1450, 1102], ['counting', 612, 780], ['counting', 905, 744], ['pending'], ['declared', 988, 1210], ['counting', 410, 410], ['counting', 1320, 801]];
    const now = new Date().toISOString();
    const jobs = [];
    try {
      for (let i = 0; i < ROSTER.length; i++) {
        const s = ROSTER[i]; const p = s.id === 'zptc' ? ['counting', 8420, 7915] : s.kind === 'ZPTC' ? P[(i + 2) % P.length] : P[(i - 1) % P.length];
        const body = p[0] === 'pending' ? { status: 'pending', ours: 0, rivals: [], nota: null, note: '', sample: true, updatedAt: now, updatedBy: uid }
          : { status: p[0], ours: p[1] + i * 7, rivals: [{ name: 'Sample rival A', party: 'YSRCP', votes: p[2] + i * 5 }, { name: 'Sample rival B', party: 'IND', votes: 120 + i * 3 }], nota: 14 + i, note: 'Sample', sample: true, updatedAt: now, updatedBy: uid };
        if (s.editable) body.cand = { name: 'Sample candidate ' + (i - 14), party: 'TDP' };
        jobs.push(() => db.doc('results/' + s.id).set(body));
      }
      await runJobs(jobs);
      await logAction('', 'sample results filled'); toolSay('Sample results filled.');
    } catch (e) { toolSay(errText(e)); }
  }
  async function clearSample() {
    try { const hit = ROSTER.filter((s) => results[s.id] && results[s.id].sample); await runJobs(hit.map((s) => () => db.doc('results/' + s.id).delete())); await logAction('', 'sample results cleared'); toolSay('Cleared ' + hit.length + ' sample results.'); } catch (e) { toolSay(errText(e)); }
  }
  async function clearAll() {
    const b = $('#clearAll');
    if (!b.dataset.armed) { b.dataset.armed = '1'; b.textContent = 'Tap again to clear every result (candidate names stay)'; setTimeout(() => { if (b.isConnected) { delete b.dataset.armed; b.textContent = 'Clear all results'; } }, 5000); return; }
    try { const hit = ROSTER.filter((s) => results[s.id]); await runJobs(hit.map((s) => () => { const c = s.editable && results[s.id].cand && !results[s.id].sample ? results[s.id].cand : null; if (c) return db.doc('results/' + s.id).set({ status: 'pending', ours: 0, rivals: [], nota: null, note: '', sample: false, cand: c, updatedAt: new Date().toISOString(), updatedBy: uid }); return db.doc('results/' + s.id).delete(); })); await logAction('', 'all results cleared'); toolSay('Cleared ' + hit.length + ' results.'); } catch (e) { toolSay(errText(e)); }
    delete b.dataset.armed; b.textContent = 'Clear all results';
  }

  // ---- tabs ----
  function showTab(t) {
    if (!['viewer', 'mptc', 'counter'].includes(t) || (t === 'counter' && !canWrite)) t = 'viewer';
    ['viewer', 'mptc', 'counter'].forEach((k) => { $('#' + k).hidden = k !== t; $('#tab-' + k).setAttribute('aria-selected', String(k === t)); });
    try { if (location.hash.slice(1) !== t) history.replaceState(null, '', '#' + t); } catch (e) {}
  }
  document.querySelectorAll('.tabs button').forEach((b) => b.addEventListener('click', () => showTab(b.dataset.tab)));
  window.addEventListener('hashchange', () => showTab(location.hash.slice(1)));
  $('#tab-counter').hidden = !canWrite;

  function setLive(on, txt) { $('#live').className = 'live' + (on ? ' on' : ''); $('#liveTxt').textContent = txt; }
  function renderAll() {
    const last = Object.values(results).map((r) => r.updatedAt).filter(Boolean).sort().pop();
    setLive(live, live ? 'Live' + (last ? ' · last update ' + fmtTime(last) + ' IST' : ' · waiting for first result') : 'Offline');
    renderViewer(); renderMptc(); if (canWrite) renderCounter();
  }
  showTab(location.hash.slice(1));
  renderAll();
  if (!db) { $('#msg').append(h('div', { class: 'notice err', text: 'Live results are not available in this view. Open the page from its claude.ai link while signed in.' })); return; }
  db.collection('results').onSnapshot((snap) => { results = {}; snap.docs.forEach((d) => { if (BY[d.id]) results[d.id] = d.data(); }); live = true; renderAll(); },
    () => { live = false; renderAll(); $('#msg').replaceChildren(h('div', { class: 'notice err', text: 'Live updates stopped. Reload the page to reconnect.' })); });
  db.collection('log').orderBy('at', 'desc').limit(40).onSnapshot((snap) => { logs = snap.docs.map((d) => d.data()); renderLog(); }, () => {});
})();
</script>
